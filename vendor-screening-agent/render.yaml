# One-click deploy config for Render.com (free tier)
# On render.com: New -> Blueprint -> connect this repo -> Apply.
services:
  - type: web
    name: vendor-screening-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
